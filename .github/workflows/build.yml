name: Build

on: push

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - run: npm install
      - run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: builds
          path: .Builds/*.zip
          include-hidden-files: true
          if-no-files-found: error
