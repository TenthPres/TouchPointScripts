name: Test and Build

on: push

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run AtriumControl tests
        working-directory: AtriumControl
        run: python -m unittest discover tests -v

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - run: npm install
      - run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: builds
          path: .Builds/*.zip
          include-hidden-files: true
          if-no-files-found: error
